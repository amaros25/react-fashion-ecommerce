server {
    listen 80;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # Dies behebt den 404-Fehler bei F5 (Reload)
        try_files $uri $uri/ /index.html;
    }

    # Fehlerseiten (optional)
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}





